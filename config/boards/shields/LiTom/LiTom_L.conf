CONFIG_ZMK_BLE=y

# Persist the split Bluetooth bond across power cycles.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_I2C_NRFX=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

CONFIG_ZMK_KEYBOARD_NAME="LiTom"

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_WPM=n

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 省電力 (右手側と同じ設定にしておく)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# OLED のブランクまでの時間 (既定 30 秒)。左手はトラックボールが無いので
# 右手側のような副作用は無い。
CONFIG_ZMK_IDLE_TIMEOUT=10000

# 消灯状態は右手 (central) の &oled_power から split のリレーイベントで
# 届く。ブランク制御は tom_oled の widgets/oled_power.c が持つので、
# ZMK 本体のアイドルブランクは切る (詳細は LiTom_R.conf の同じ箇所)。
CONFIG_ZMK_TOM_OLED_POWER_CONTROL=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
