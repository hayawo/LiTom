CONFIG_ZMK_KEYBOARD_NAME="LiTom"
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Persist Bluetooth bonds and ZMK profiles across power cycles.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# PMW3610設定
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
# 省電力中のサンプリング間隔。既定は REST2=100ms / REST3=500ms だが、
# その間の動きはセンサー内部に溜まり、次の 1 件にまとめて届く。
# まとまった大きな移動量は、Windows の「ポインターの精度を高める」で
# 何倍にも増幅されるため、「触った瞬間にカーソルが大きく飛ぶ」形になる。
# 実測でも、空白 90ms / 57ms の直後に |dx|+|dy| が 216 / 156 の値が届いて
# いた (通常の移動は 20〜80)。溜まる時間を短くして飛距離を抑える。
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

# バッテリー監視
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# NFC pins有効化
CONFIG_NFCT_PINS_AS_GPIOS=y

# I2C設定
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_PINCTRL=y
CONFIG_SENSOR=y

# OLED設定
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_TOM_OLED_DONGLE_BATTERY=y
CONFIG_ZMK_TOM_OLED_MAC_MODIFIERS=y
CONFIG_ZMK_TOM_OLED_CODEX_STATUS=n

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_LITOM_PREFER_USB_ENDPOINT_ON_READY=y
# ホスト (PC) が BLE の接続間隔を伸ばしたままにすると、トラックボールの
# レポートが HID キューに溜まって「動かしてから遅れてカーソルが動く」。
# アイドル明け (モニタースリープ明けに最初に触ったとき) と、ホストが
# 間隔を伸ばしたときに、ZMK の希望値 (7.5〜15ms) を要求し直す。
# 効いているかはデバッグビルドのログ "Host link interval" で確認できる。
CONFIG_LITOM_BLE_CONN_PARAM_REFRESH=y

# --- BLE のマウスレポートが詰まる問題の対策 ---
# 実測 (Windows 側で raw input の到着間隔を記録): センサーは 125 回/秒
# 送っているのに PC には約 49 回/秒しか届かず、間隔の中央値は 15.0ms、
# 2ms 未満の塊が 24%、最大 300ms の途切れがあった。
# つまり送信待ちが常時あふれ、古いレポートから捨てられている。
#
# 1. 接続間隔の希望を 7.5ms 固定にする (既定は 7.5〜15ms)。
#    幅を持たせるとホストが遅い側の 15ms を選ぶため、上限も 6 にする。
#    7.5ms なら 1 接続イベント 1 レポートでも 133 回/秒を通せる。
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
# 2. 送信待ちの長さを 20 件から 6 件へ。20 件 x 15ms = 300ms の遅れが
#    そのまま「動かしてから遅れて動く」になっていた。溢れた分は
#    どのみち捨てられるので、古い位置を遅れて届けるより浅い方がよい。
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=6
# 3. 送る回数を 125 回/秒 から 62.5 回/秒 (16ms ごと) へ。
#    上の 1 を入れてもホスト (Windows) は 7.5ms を拒否し、接続間隔は
#    15ms のままだった。15ms では 66 回/秒しか通らず、実測 63 回/秒と
#    ほぼ上限に張り付いている。送る回数を通る量に合わせ、その 16ms の
#    間の動きは 1 件にまとめて送る (ドライバが delta を加算する)。
#    捨てられる分が無くなるので、同じ移動量が欠けずに届く。
#    注意: 慣性スクロールの設定はイベント間隔 8ms 前提なので、
#    LiTom_R.overlay の &scroll_inertia も合わせて調整している。
#
#    値が 16 ではなく 12 なのは、ドライバの判定が「前回送信から
#    INTERVAL ms 以上経過したか」だから。センサーは 8ms 刻みなので 16 に
#    すると 16ms の回がわずかな誤差で弾かれ、次の 24ms の回まで待つ。
#    実測でも中央値 22.4ms / 45.5 回per秒 になっていた。12 なら 8ms の回は
#    送らず 16ms の回は必ず通るので、狙いどおり 62.5 回per秒 になる。
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# 4. 送信バッファ (BT_BUF_ACL_TX_COUNT / BT_L2CAP_TX_BUF_COUNT) を 12 まで
#    増やす案は実測で悪化したため撤回した (既定の 3 / 5 に戻す)。
#    キー入力区間の途切れ率 4.0% -> 5.7%、p99 60ms -> 225ms。
#    バッファを増やしても電波の時間は増えないので、待ち行列が深くなった
#    分だけ遅れが伸びただけだった。ZMK 側のキューを 20 -> 6 に浅くして
#    改善したのと逆方向の変更になっていた。
#
# 5. 左手との接続間隔を 7.5ms -> 15ms にする案も実測で悪化したため撤回した
#    (既定の 6 = 7.5ms に戻す)。キー入力区間の途切れ率 4.0% -> 7.3%、
#    間隔の中央値 15.0ms -> 22.2ms。PC 側と同じ 15ms にしたことで、毎回
#    同じタイミングで衝突するようになったと思われる。
#
# ここまでで最良なのは上の 1〜3 のみを入れた状態 (この構成)。
# 実測: マウス 54.9 回per秒、中央値 15.0ms、キー入力区間の途切れ率 4.0%、
# p99 60ms、最大 308ms。対策前は 49 回per秒 / 24% が塊 / 最大 360ms。
# 残る「キー入力中にマウスが飛ぶ」は、接続間隔 15ms の帯域をキーボードと
# マウスで奪い合うためで、ホスト側が 7.5ms を拒否する以上、BLE のままでは
# 埋められない。ゲーム中など確実にしたいときは USB ケーブルで繋ぐこと。
# トラックボール操作によるマウスレイヤー自動切り替えは無効。
# レイヤー1(MOUSE)はキーマップの &lt 1 H から手動で呼び出す。
CONFIG_LITOM_AUTO_MOUSE_LAYER=n

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 省電力
# 単4電池2本の構成なので、無操作が続いたらディープスリープへ落とす。
# 復帰はキー入力のみ (kscan0 の wakeup-source)。トラックボールでは起きない。
# USB 給電中はスリープしない (activity.c の is_usb_power_present)。
# タイムアウトは DYA Studio の電源設定から実行時に変更できる。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK が IDLE と見なすまでの時間。
# 元は OLED のブランクを早めるために 10 秒にしていたが、ブランクの制御は
# tom_oled の oled_power.c へ移して CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n に
# しているので、今このタイムアウトが効くのはトラックボールの force-awake
# だけになっている (LiTom_R.overlay の trackball を参照)。
# 10 秒だと、少し放置しただけでセンサーが省電力へ落ち、次に触れたときに
# 溜まった動きが 1 件で届いてカーソルが飛ぶ。60 秒へ延ばして、通常の
# 使用中は落ちないようにする。
# 電池を持たせたいときは OLED を &oled_power キーで消すのが一番効く。
CONFIG_ZMK_IDLE_TIMEOUT=60000

# OLED の点灯 / 消灯を &oled_power キー (FUNCTION レイヤーの X 位置) で切り替える。
# ブランクの制御は tom_oled 側の widgets/oled_power.c が一括して持つため、
# ZMK 本体のアイドルブランクは切っておく。両方が動くと、消灯中でも打鍵の
# たびに本体側がパネルを点け直してしまう。
# tom_oled の Kconfig.defconfig でも既定 n にしているが、取り違えると
# 症状が分かりにくいので設定側でも明示する。
CONFIG_ZMK_TOM_OLED_POWER_CONTROL=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
