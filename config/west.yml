    # cormoran/zmk-module-runtime-input-processor の zmk-v0.3.0.0 に、
    # scale_val() の int16 オーバーフロー修正だけを載せたフォーク。
    # 本家は掛け算の結果を int16_t で受けているため、Studio で 1.00x 以外の
    # 倍率にすると速い動きでカーソル / スクロールが逆方向へ飛ぶ。
    # 本家が修正されたら remote: cormoran に戻すこと。
    - name: zmk-module-runtime-input-processor
      remote: hayawo
      revision: fix/scale-val-int16-overflow
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: zmk-v0.3.0.0
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: zmk-0.3
    # 本家 pukuhei/zmk-tom-oled は 2026-08-13 に ZMK v0.4 へ移行し、LVGL v9 の
    # 型 (lv_draw_buf_t) を使い始めたため main では v0.3 (LVGL v8) の本リポジトリ
    # でビルドできない。v0.3 対応の最終コミット bbfe719 を基点にしたフォークで、
    # HID インジケータの有効化と peripheral のバッテリー表示を追加している。
    # ZMK を v0.4 へ上げる際は、本家の v0.4 版へこの差分を載せ直すこと。
    - name: zmk-tom-oled
      remote: hayawo
      revision: fix/hid-indicators-and-peripheral-battery
    # 可動ブランチを指すと本家の更新で不意にビルドが壊れるため SHA で固定する。
    - name: zmk-input-processor-scroll-inertia
      remote: mjmjm0101
      revision: f7dadefee453d555fe066d13a3de3bb60739b45e
  self:
    path: config
